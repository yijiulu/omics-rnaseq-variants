name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Check Python and shell syntax
        run: |
          python -m py_compile 02_variant_calling/scripts/*.py 02_variant_calling/tests/*.py
          bash -n 02_variant_calling/scripts/*.sh

      - name: Run variant-calling parser unit tests
        run: python -m unittest discover -s 02_variant_calling/tests -v

      - name: Run RNA-seq CLI and loader unit tests
        run: Rscript 01_rnaseq/tests/test_rnaseq_cli.R
